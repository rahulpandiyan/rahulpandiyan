```yaml
name: Generate GitHub Profile Graphics

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Fix directory permission issue
      - name: Prepare output directory
        run: |
          sudo rm -rf dist
          mkdir -p dist
          sudo chown -R "$(id -u):$(id -g)" dist
          chmod -R u+rwX dist

      # Generate contribution snake
      - name: Generate Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Generate custom achievement panel
      - name: Generate Custom Achievement Panel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: rahulpandiyan
        run: |
          mkdir -p dist
          chmod -R u+rwX dist

          python - <<'PY'
          import os
          import json
          import urllib.request
          from xml.sax.saxutils import escape

          username = os.environ["GH_USERNAME"]
          token = os.environ["GH_TOKEN"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "GitHub-Profile-Graphics"
          }

          def api_get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.loads(response.read())

          # Fetch profile data
          profile = api_get(
              f"https://api.github.com/users/{username}"
          )

          followers = profile["followers"]
          public_repos = profile["public_repos"]

          # Count total stars across public repositories
          total_stars = 0
          page = 1

          while True:
              repos = api_get(
                  f"https://api.github.com/users/{username}/repos"
                  f"?per_page=100&page={page}&type=owner"
              )

              if not repos:
                  break

              total_stars += sum(
                  repo["stargazers_count"] for repo in repos
              )

              if len(repos) < 100:
                  break

              page += 1

          # Fetch contribution count using GraphQL
          graphql_url = "https://api.github.com/graphql"

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {"login": username}
          }).encode()

          req = urllib.request.Request(
              graphql_url,
              data=payload,
              headers={
                  **headers,
                  "Content-Type": "application/json"
              }
          )

          with urllib.request.urlopen(req) as response:
              result = json.loads(response.read())

          if "errors" in result:
              raise RuntimeError(
                  f"GitHub GraphQL error: {result['errors']}"
              )

          contributions = result["data"]["user"][
              "contributionsCollection"
          ]["contributionCalendar"]["totalContributions"]

          # SVG metrics
          metrics = [
              ("TOTAL STARS", total_stars, "★", "#fbbf24"),
              ("PUBLIC REPOS", public_repos, "⌘", "#a78bfa"),
              ("CONTRIBUTIONS", contributions, "⚡", "#22d3ee"),
              ("FOLLOWERS", followers, "♧", "#f472b6"),
          ]

          width = 860
          height = 230

          svg = [
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{width}" height="{height}" '
              f'viewBox="0 0 {width} {height}">',
              '<defs>',
              '<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">',
              '<stop offset="0%" stop-color="#111827"/>',
              '<stop offset="100%" stop-color="#0d1117"/>',
              '</linearGradient>',
              '</defs>',
              '<rect width="100%" height="100%" rx="18" '
              'fill="url(#bg)" stroke="#30363d"/>',
              '<text x="30" y="38" fill="#8b5cf6" '
              'font-size="12" font-family="monospace" '
              'letter-spacing="3">GITHUB / DEVELOPER MILESTONES</text>',
              '<text x="30" y="66" fill="#f0f6fc" '
              'font-size="22" font-weight="bold" '
              'font-family="sans-serif">Rahul Pandiyan</text>',
              '<text x="830" y="40" fill="#22d3ee" '
              'font-size="11" text-anchor="end" '
              'font-family="monospace">LIVE PROFILE DATA</text>',
          ]

          card_width = 190
          gap = 16
          start_x = 30
          card_y = 92
          card_height = 112

          for i, (label, value, symbol, color) in enumerate(metrics):
              x = start_x + i * (card_width + gap)

              svg.append(
                  f'<rect x="{x}" y="{card_y}" '
                  f'width="{card_width}" height="{card_height}" '
                  f'rx="12" fill="#161b22" stroke="#30363d"/>'
              )

              svg.append(
                  f'<text x="{x + 18}" y="{card_y + 29}" '
                  f'fill="{color}" font-size="13" '
                  f'font-family="sans-serif">'
                  f'{escape(symbol)} {escape(label)}</text>'
              )

              svg.append(
                  f'<text x="{x + 18}" y="{card_y + 76}" '
                  f'fill="#f0f6fc" font-size="32" '
                  f'font-weight="bold" font-family="monospace">'
                  f'{value:,}</text>'
              )

              svg.append(
                  f'<rect x="{x + 18}" y="{card_y + 91}" '
                  f'width="{card_width - 36}" height="3" '
                  f'rx="2" fill="{color}" opacity="0.8"/>'
              )

          svg.append(
              '<text x="30" y="220" fill="#6e7681" '
              'font-size="10" font-family="monospace">'
              'AUTOMATICALLY GENERATED WITH GITHUB ACTIONS'
              '</text>'
          )

          svg.append("</svg>")

          output_path = "dist/custom-trophies.svg"

          # Explicitly ensure write access
          os.makedirs("dist", exist_ok=True)

          with open(output_path, "w", encoding="utf-8") as f:
              f.write("\n".join(svg))

          print("Custom achievement panel generated successfully.")
          PY

      # Publish generated graphics to output branch
      - name: Publish Graphics
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          commit_message: "Update GitHub profile graphics"
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
