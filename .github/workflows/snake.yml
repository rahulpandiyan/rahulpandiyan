name: Generate GitHub Profile Graphics

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Fix directory permission issue
      - name: Prepare output directory
        run: |
          sudo rm -rf dist
          mkdir -p dist
          sudo chown -R "$(id -u):$(id -g)" dist
          chmod -R u+rwX dist

      # Generate contribution snake
      - name: Generate Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Generate custom achievement panel
      - name: Generate Custom Achievement Panel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: rahulpandiyan
        run: |
          mkdir -p dist

          python - <<'PY'
          import os
          import json
          import urllib.request
          from xml.sax.saxutils import escape

          username = os.environ["GH_USERNAME"]
          token = os.environ["GH_TOKEN"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "GitHub-Profile-Graphics"
          }

          def api_get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.loads(response.read())

          # Fetch profile data
          profile = api_get(
              f"https://api.github.com/users/{username}"
          )

          followers = profile["followers"]
          public_repos = profile["public_repos"]

          # Count total stars across public repositories
          total_stars = 0
          page = 1

          while True:
              repos = api_get(
                  f"https://api.github.com/users/{username}/repos"
                  f"?per_page=100&page={page}&type=owner"
              )

              if not repos:
                  break

              total_stars += sum(
                  repo["stargazers_count"] for repo in repos
              )

              if len(repos) < 100:
                  break

              page += 1

          # Fetch contribution count using GraphQL
          graphql_url = "https://api.github.com/graphql"

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {"login": username}
          }).encode()

          req = urllib.request.Request(
              graphql_url,
              data=payload,
              headers={
                  **headers,
                  "Content-Type": "application/json"
              }
          )

          with urllib.request.urlopen(req) as response:
              result = json.loads(response.read())

          if "errors" in result:
              raise RuntimeError(
                  f"GitHub GraphQL error: {result['errors']}"
              )

          calendar = result["data"]["user"][
              "contributionsCollection"
          ]["contributionCalendar"]
          contributions = calendar["totalContributions"]

          weekly_counts = [
              sum(day["contributionCount"] for day in week["contributionDays"])
              for week in calendar["weeks"]
          ]

          if not weekly_counts:
              raise RuntimeError("GitHub returned no contribution weeks")

          graph_width = 860
          graph_height = 280
          chart_left = 58
          chart_right = 832
          chart_top = 94
          chart_bottom = 208
          chart_height = chart_bottom - chart_top
          chart_width = chart_right - chart_left
          slot_width = chart_width / len(weekly_counts)
          bar_width = min(9, slot_width * 0.62)
          max_weekly_count = max(max(weekly_counts), 1)
          month_names = (
              "Jan", "Feb", "Mar", "Apr", "May", "Jun",
              "Jul", "Aug", "Sep", "Oct", "Nov", "Dec",
          )

          activity_svg = [
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{graph_width}" height="{graph_height}" '
              f'viewBox="0 0 {graph_width} {graph_height}">',
              '<defs>',
              '<linearGradient id="activity-bg" x1="0" y1="0" x2="1" y2="1">',
              '<stop offset="0%" stop-color="#182235"/>',
              '<stop offset="100%" stop-color="#101827"/>',
              '</linearGradient>',
              '<linearGradient id="activity-bar" x1="0" y1="0" x2="0" y2="1">',
              '<stop offset="0%" stop-color="#c4b5fd"/>',
              '<stop offset="100%" stop-color="#8b5cf6"/>',
              '</linearGradient>',
              '<linearGradient id="activity-inset" x1="0" y1="0" x2="0" y2="1">',
              '<stop offset="0%" stop-color="#0c1422"/>',
              '<stop offset="100%" stop-color="#111b2c"/>',
              '</linearGradient>',
              '</defs>',
              '<rect x="3" y="5" width="854" height="270" rx="22" '
              'fill="#080d16" opacity="0.72"/>',
              '<rect x="1" y="1" width="858" height="274" rx="22" '
              'fill="url(#activity-bg)" stroke="#344158"/>',
              '<path d="M24 2 H836" stroke="#ffffff" stroke-opacity="0.08" '
              'stroke-linecap="round"/>',
              '<text x="30" y="37" fill="#f1f5f9" font-size="16" '
              'font-weight="600" font-family="sans-serif">'
              'Contribution Activity</text>',
              '<text x="30" y="56" fill="#94a3b8" font-size="10" '
              'font-family="sans-serif">Weekly activity over the past year</text>',
              f'<text x="830" y="38" fill="#c4b5fd" font-size="13" '
              f'text-anchor="end" font-weight="600" '
              f'font-family="monospace">{contributions:,}</text>',
              '<text x="830" y="55" fill="#94a3b8" font-size="9" '
              'text-anchor="end" font-family="sans-serif">contributions</text>',
              '<rect x="24" y="69" width="812" height="174" rx="14" '
              'fill="#0b1321" stroke="#28364d"/>',
              '<path d="M38 70 H822" stroke="#ffffff" stroke-opacity="0.04" '
              'stroke-linecap="round"/>',
          ]

          for fraction in (0, 0.5, 1):
              y = chart_bottom - fraction * chart_height
              label = round(fraction * max_weekly_count)
              activity_svg.extend([
                  f'<line x1="{chart_left}" y1="{y:.1f}" '
                  f'x2="{chart_right}" y2="{y:.1f}" '
                  'stroke="#334155" stroke-opacity="0.62" '
                  'stroke-dasharray="3 6"/>',
                  f'<text x="47" y="{y + 3:.1f}" fill="#64748b" '
                  f'font-size="10" text-anchor="end" '
                  f'font-family="monospace">{label}</text>',
              ])

          previous_month = None
          for i, week in enumerate(calendar["weeks"]):
              week_date = week["contributionDays"][0]["date"]
              month = int(week_date[5:7])
              if month != previous_month:
                  x = chart_left + i * slot_width
                  activity_svg.append(
                      f'<text x="{x:.1f}" y="233" fill="#94a3b8" '
                      f'font-size="9" font-family="sans-serif">'
                      f'{month_names[month - 1]}</text>'
                  )
                  previous_month = month

              count = weekly_counts[i]
              bar_height = max(3, count * chart_height / max_weekly_count)
              x = chart_left + i * slot_width + (slot_width - bar_width) / 2
              y = chart_bottom - bar_height
              activity_svg.extend([
                  f'<rect x="{x:.1f}" y="{y + 2:.1f}" '
                  f'width="{bar_width:.1f}" height="{bar_height:.1f}" '
                  f'rx="4" fill="#080d16" opacity="0.8"/>',
                  f'<rect x="{x:.1f}" y="{y:.1f}" '
                  f'width="{bar_width:.1f}" height="{bar_height:.1f}" '
                  f'rx="4" fill="url(#activity-bar)"/>',
                  f'<path d="M{x + 1:.1f} {y + 3:.1f} '
                  f'v{max(bar_height - 6, 0):.1f}" stroke="#ffffff" '
                  'stroke-opacity="0.16" stroke-linecap="round"/>',
              ])

          activity_svg.extend([
              '<text x="30" y="262" fill="#64748b" font-size="9" '
              'font-family="sans-serif">Less</text>',
              '<rect x="58" y="253" width="12" height="8" rx="3" '
              'fill="#29364b"/>',
              '<rect x="75" y="253" width="12" height="8" rx="3" '
              'fill="#8b5cf6"/>',
              '<text x="92" y="262" fill="#64748b" font-size="9" '
              'font-family="sans-serif">More</text>',
              '</svg>',
          ])

          with open("dist/contribution-activity.svg", "w", encoding="utf-8") as f:
              f.write("\n".join(activity_svg))

          # SVG metrics
          metrics = [
              ("TOTAL STARS", total_stars),
              ("PUBLIC REPOS", public_repos),
              ("CONTRIBUTIONS", contributions),
              ("FOLLOWERS", followers),
          ]

          width = 860
          height = 230

          svg = [
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{width}" height="{height}" '
              f'viewBox="0 0 {width} {height}">',
              '<defs>',
              '<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">',
              '<stop offset="0%" stop-color="#182235"/>',
              '<stop offset="100%" stop-color="#101827"/>',
              '</linearGradient>',
              '<linearGradient id="card" x1="0" y1="0" x2="0" y2="1">',
              '<stop offset="0%" stop-color="#202d43"/>',
              '<stop offset="100%" stop-color="#172235"/>',
              '</linearGradient>',
              '</defs>',
              '<rect x="3" y="5" width="854" height="220" rx="22" '
              'fill="#080d16" opacity="0.72"/>',
              '<rect x="1" y="1" width="858" height="224" rx="22" '
              'fill="url(#bg)" stroke="#344158"/>',
              '<path d="M24 2 H836" stroke="#ffffff" stroke-opacity="0.08" '
              'stroke-linecap="round"/>',
              '<text x="30" y="38" fill="#f1f5f9" '
              'font-size="16" font-weight="600" '
              'font-family="sans-serif">Developer Highlights</text>',
              '<text x="30" y="57" fill="#94a3b8" '
              'font-size="10" font-family="sans-serif">'
              'A snapshot of my public GitHub profile</text>',
          ]

          card_width = 190
          gap = 16
          start_x = 30
          card_y = 92
          card_height = 112

          for i, (label, value) in enumerate(metrics):
              x = start_x + i * (card_width + gap)

              svg.append(
                  f'<rect x="{x + 1}" y="{card_y + 4}" '
                  f'width="{card_width}" height="{card_height}" '
                  'rx="14" fill="#0b111c" opacity="0.75"/>'
              )

              svg.append(
                  f'<rect x="{x}" y="{card_y}" '
                  f'width="{card_width}" height="{card_height}" '
                  'rx="14" fill="url(#card)" stroke="#36445b"/>'
              )

              svg.append(
                  f'<path d="M{x + 15} {card_y + 1} '
                  f'H{x + card_width - 15}" stroke="#ffffff" '
                  'stroke-opacity="0.10" stroke-linecap="round"/>'
              )

              svg.append(
                  f'<text x="{x + 18}" y="{card_y + 34}" '
                  'fill="#a5b4fc" font-size="10" '
                  'font-weight="600" letter-spacing="1.1" '
                  'font-family="sans-serif">'
                  f'{escape(label)}</text>'
              )

              svg.append(
                  f'<text x="{x + 18}" y="{card_y + 78}" '
                  'fill="#f1f5f9" font-size="32" '
                  'font-weight="600" font-family="monospace">'
                  f'{value:,}</text>'
              )

              svg.append(
                  f'<text x="{x + 18}" y="{card_y + 97}" '
                  'fill="#64748b" font-size="10" '
                  'font-family="sans-serif">Public profile</text>'
              )

          svg.append(
              '<text x="30" y="216" fill="#64748b" '
              'font-size="9" font-family="sans-serif">'
              'Updated automatically from GitHub</text>'
          )

          svg.append("</svg>")

          output_path = "dist/custom-trophies.svg"

          # Explicitly ensure write access
          os.makedirs("dist", exist_ok=True)

          with open(output_path, "w", encoding="utf-8") as f:
              f.write("\n".join(svg))

          print("Custom achievement panel generated successfully.")
          PY

      # Publish generated graphics to output branch
      - name: Publish Graphics
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          commit_message: "Update GitHub profile graphics"
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
